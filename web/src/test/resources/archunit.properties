# Existing layer violations live in the baseline. A new one fails the build.
freeze.store.default.path=src/test/resources/archunit-baseline
freeze.store.default.allowStoreCreation=false
# The store never changes by itself. Fixing a violation means passing
# -Darchunit.freeze.store.default.allowStoreUpdate=true once and committing the result.
freeze.store.default.allowStoreUpdate=false
